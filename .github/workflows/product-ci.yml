name: Product validation increment
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  artifact-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore pinned validation dependencies
        run: dotnet restore Kordra.slnx --locked-mode
      - name: Build domain and tests
        run: dotnet build Kordra.slnx --configuration Release --no-restore
      - name: Test artifact identity, content verification and module boundary
        run: dotnet test Kordra.slnx --configuration Release --no-build --no-restore --logger trx
