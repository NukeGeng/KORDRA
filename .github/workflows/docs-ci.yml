name: Documentation integrity
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  clients-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact Clients pin in a fresh checkout
        run: python3 docs/tooling/submodulecheck.py --require-checkout
  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test AMR routing, contracts and safety boundaries
        run: python3 -m unittest discover -s docs/tooling/tests -v
      - name: Validate documentation structure
        run: python3 docs/tooling/doccheck.py --strict-sources
      - name: Enforce source-to-feature mapping in PR
        if: github.event_name == 'pull_request'
        run: python3 docs/tooling/changeguard.py --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Validate reference-environment cases
        run: python3 docs/tooling/scopecheck.py
